  <path d="M116 261h18" stroke="#f7768e" stroke-width="7" stroke-linecap="round"/>
  <rect x="144" y="252" width="56" height="18" rx="9" fill="#f7768e"/>
  <rect x="112" y="300" width="96" height="26" rx="13" fill="#636a86"/>

  <!-- New side: context and added rows -->
  <rect x="284" y="136" width="116" height="26" rx="13" fill="#636a86"/>
  <rect x="276" y="184" width="132" height="42" rx="10" fill="#17331f"/>
