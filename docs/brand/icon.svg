  <line x1="256" y1="126" x2="256" y2="386" stroke="#7dcfff" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>

  <!-- Old side: context and removed rows -->
  <rect x="112" y="136" width="116" height="26" rx="13" fill="#636a86"/>
  <rect x="104" y="184" width="132" height="42" rx="10" fill="#3a1a20"/>
  <path d="M116 205h18" stroke="#f7768e" stroke-width="7" stroke-linecap="round"/>
