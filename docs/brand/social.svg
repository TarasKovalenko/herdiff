<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640">
  <title>herdiff social preview</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d27"/>
      <stop offset="1" stop-color="#0f1016"/>
    </linearGradient>
    <clipPath id="shot">
      <rect x="690" y="150" width="550" height="400" rx="16"/>
    </clipPath>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <image href="icon.svg" xlink:href="icon.svg" x="72" y="96" width="168" height="168"/>

  <text x="72" y="346" fill="#e6e8f0" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-2">herdiff</text>
  <text font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#a9b1d6">
    <tspan x="74" y="404">Live, syntax-highlighted diffs of what</tspan>
    <tspan x="74" y="446">your herdr agents are changing.</tspan>
  </text>
  <text x="74" y="540" fill="#7dcfff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">herdr plugin install TarasKovalenko/herdiff</text>

  <!-- A window onto the real UI: the generated split screenshot, cropped around the divider
       where the removed and added rows sit. -->
  <g clip-path="url(#shot)">
    <rect x="690" y="150" width="550" height="400" fill="#15161c"/>
    <image href="../screenshots/split.svg" xlink:href="../screenshots/split.svg" x="80" y="-138" width="1344" height="720"/>
  </g>
  <rect x="690.75" y="150.75" width="548.5" height="398.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
