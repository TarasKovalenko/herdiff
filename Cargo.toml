[package]
name = "herdiff"
version = "0.2.0"
edition = "2024"
description = "Live diff viewer for the git repos your herdr agents are working in"
repository = "https://github.com/TarasKovalenko/herdiff"
license = "MIT"
readme = "README.md"
keywords = ["herdr", "diff", "git", "tui", "ai-agents"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.189"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
